<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Segoe UI, Inter, Arial, sans-serif">
  <rect width="1200" height="630" fill="#FFF9EC"/>
  <circle cx="1130" cy="600" r="200" fill="#FDEAF3"/>
  <rect x="860" y="34" width="300" height="44" rx="22" fill="#16131C"/>
  <text x="1010" y="63" font-size="17" font-weight="700" fill="#FFC21A" text-anchor="middle" letter-spacing="2">STRATEGY BLUEPRINT</text>
  <text x="60" y="66" font-size="22" font-weight="700" fill="#D6167A" letter-spacing="3">EMAIL AUTOMATION</text>
  <text x="60" y="118" font-size="40" font-weight="800" fill="#16131C">Skincare e-commerce store</text>
  <g font-size="16">
    <!-- card 1 -->
    <g transform="translate(60,170)">
