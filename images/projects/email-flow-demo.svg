      <text x="22" y="356" font-size="14" fill="#8A8391">Trigger: newsletter sign-up</text>
    </g>
    <path d="M400 365 h30" stroke="#D6167A" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(445,170)">
      <rect width="330" height="390" rx="22" fill="#fff" stroke="#F0E3C8"/>
      <rect x="22" y="22" width="170" height="30" rx="15" fill="#FFF3CF"/><text x="107" y="43" text-anchor="middle" font-weight="700" fill="#8A6400">ABANDONED CART</text>
      <text x="22" y="86" font-size="20" font-weight="800" fill="#16131C">2 emails · 1h &amp; 24h</text>
