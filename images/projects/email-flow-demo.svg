      <text x="22" y="240" fill="#4A4553">1 · Cart reminder with product</text>
      <text x="22" y="270" fill="#4A4553">2 · Answer common questions</text>
      <text x="22" y="300" fill="#4A4553">Exit: purchase completed</text>
      <text x="22" y="356" font-size="14" fill="#8A8391">Trigger: checkout started</text>
    </g>
    <path d="M785 365 h30" stroke="#D6167A" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(830,170)">
